services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: superset
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/sql/001_schema.sql:ro
      - ./sql/003_load.sql:/sql/003_load.sql:ro
      - ./sql/004_client_attributes.sql:/sql/004_client_attributes.sql:ro
      - ./sql/005_norms.sql:/sql/005_norms.sql:ro
      - ./sql/002_init.sh:/docker-entrypoint-initdb.d/002_init.sh:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  superset:
    build: .
    image: sco-daily-reports-superset:4.1.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_METADATA_DB: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    restart: unless-stopped

volumes:
  pgdata:
